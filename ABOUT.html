    <script>
    (function() {
        const overlay = document.getElementById("construction-overlay");
        const char = document.getElementById("construction-char");
        const bubble = document.getElementById("anger-bubble");

        // オーバーレイが後ろのクリックを邪魔する（意図通り）
        // 文字は pointer-events: none なのでクリックできない
        // キャラクターは通常のクリックが可能

        let clickCount = 0;
        let bubbleTimer = null;
        let animTimer = null;

        char.addEventListener("click", function(e) {
            e.stopPropagation();
            clickCount++;

            // クリック時に一瞬振動
            char.classList.remove("is-shaking");
            void char.offsetWidth; // リフローしてアニメーションをリセット
            char.classList.add("is-shaking");
            setTimeout(function() {
                char.classList.remove("is-shaking");
            }, 250);

            if (clickCount >= 5) {
                showBubble();
            }

            clearTimeout(window._eggResetTimer);
            window._eggResetTimer = setTimeout(function() {
                clickCount = 0;
                hideBubble();
            }, 2000);
        });

        function showBubble() {
            bubble.classList.add("is-visible");
            startStopMotion();
        }

        function hideBubble() {
            bubble.classList.remove("is-visible");
            stopStopMotion();
        }

        // ストップモーション風アニメーション（0.5秒ごと微妙に動く）
        function startStopMotion() {
            stopStopMotion();
            let frame = 0;
            const bubbleOffsets = [
                { x: 0, y: 0, r: -2 },
                { x: 2, y: -1, r: 1 },
                { x: -1, y: 1, r: -1 },
                { x: 1, y: 0, r: 2 },
                { x: -2, y: -1, r: 0 },
                { x: 0, y: 1, r: -1 }
            ];
            const charOffsets = [
                { x: 0, y: 0, r: 0 },
                { x: -1, y: 1, r: 1 },
                { x: 1, y: -1, r: -1 },
                { x: 0, y: 0, r: 2 },
                { x: 1, y: 1, r: -1 },
                { x: -1, y: 0, r: 0 }
            ];
            animTimer = setInterval(function() {
                frame = (frame + 1) % bubbleOffsets.length;
                const b = bubbleOffsets[frame];
                const c = charOffsets[frame];
                bubble.style.transform = "translate(" + b.x + "px, " + b.y + "px) rotate(" + b.r + "deg)";
                char.style.transform = "translate(" + c.x + "px, " + c.y + "px) rotate(" + c.r + "deg)";
            }, 500);
        }

        function stopStopMotion() {
            if (animTimer) {
                clearInterval(animTimer);
                animTimer = null;
            }
            bubble.style.transform = "";
            char.style.transform = "";
        }
    })();
    </script>
